<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Lara's Pages</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      $().ready(function() {
        console.log("ready; set; go.");
        let file = "https://raw.githubusercontent.com/Lara-m/Lara-m.github.io/refs/heads/main/posts.json"
        fetch(file)
          .then(data => data.json())
          .then(data => console.log(data))
          .then(data => JSON.parse(data.posts()))
          .then(data => document.getElementById('posts').innerHTML=JSON.stringify(data, undefined, 2));
      });
    </script>
  </head>
  <body>
    <nav class="navbar navbar-expand-xl navbar-dark mb-4" style="background-color: #03002e;">
      <a class="navbar-brand px-3" href="#">Lara's Personal Pages</a>
      <div class="collapse navbar-collapse" id="navbarCollapse">
      <ul class="navbar-nav" id="myTab" role="tablist">
        <li class="nav-item" role="presentation"><button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">Home</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">Blog</button></li>
        <li class="nav-item" role="presentation"><button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">Contact</button></li>
      </ul>
      </div>
    </nav>
    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
        <div class="container p-5 my-5 border"> 
          <div class="jumbotron">
            <h1>Still under construction!</h1>
            <p class="lead">Lorem ipsum or something like that...</p>
          </div>
        </div>
      </div>
      <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab" tabindex="0">
        <div class="container p-5 my-5 border"> 
            <pre id="posts"/>
          </div>
      </div>
      <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">
        <div class="container p-5 my-5 border">
          <h1> Why are you even here?</h1>
          <p class="lead"> If you got here from another link, you know how to reach me.<br>
            If you did not, I don't think you should reach me.<br>
            'Ave a good day!<br>
            <a href="https://github.com/Lara-m/"> L </a> 
          </p>
        </div>
      </div>
    </div>


    <footer class="footer fixed-bottom bg-light">
      <div class="container">
        <span class="text-muted"> Copyright Lara-m 2026. How did you get here? :/</span>
      </div>
    </footer>
  </body>
</html>
